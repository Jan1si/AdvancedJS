<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>4 - Timer</title>
</head>
<body>
    <div class="container">
        <ul class="timer">
            <li class="item-timer" id="monts">10 месяцев</li>
            <li class="item-timer" id="days">4 дней</li>
            <li class="item-timer" id="hours">12 часов</li>
            <li class="item-timer" id="minutes">40 минут</li>
            <li class="item-timer" id="seconds">10 секунд</li>
        </ul>
    </div>
    <script src="app.js"></script>
</body>
</html>
